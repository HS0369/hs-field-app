<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthSpace - Phlebo Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --header-bg: #2b5b84;
    --bg: #f4f6f9;
    --dark: #1f2937;
    --sub: #6b7280;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  body { background: var(--bg); color: var(--dark); padding-bottom: 30px; }

  .phlebo-header {
    background: var(--header-bg); color: #fff; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 0 0 20px 20px;
  }
  .user-info { display: flex; align-items: center; gap: 12px; }
  .user-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; }
  .user-details h4 { font-size: 13px; font-weight: 500; opacity: 0.8; }
  .user-details h3 { font-size: 16px; font-weight: 700; }

  .section-title { font-size: 16px; font-weight: 700; margin: 20px 16px 12px; color: var(--dark); }

  /* QUICK LINKS GRID */
  .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px; }
  .grid-item {
    background: #fff; padding: 18px 10px; border-radius: 12px;
    text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .grid-item i { font-size: 22px; color: #2b5b84; margin-bottom: 8px; }
  .grid-item span { display: block; font-size: 12px; font-weight: 600; color: #4b5563; }
</style>
</head>

<body>

<div class="phlebo-header">
  <div class="user-info">
    <img src="https://via.placeholder.com/44" id="phleboPic" class="user-avatar" alt="Avatar">
    <div class="user-details">
      <h4>Welcome ,</h4>
      <h3 id="phleboName">Phlebo Officer</h3>
    </div>
  </div>
</div>

<h3 class="section-title">Quick Links</h3>
<div class="grid-container">
  <div class="grid-item"><i class="fa-solid fa-calendar-minus"></i><span>Leave</span></div>
  <div class="grid-item"><i class="fa-solid fa-pen-to-square"></i><span>Orders</span></div>
  <div class="grid-item"><i class="fa-solid fa-square-check"></i><span>Served</span></div>
  <div class="grid-item"><i class="fa-solid fa-network-wired"></i><span>Hub</span></div>
  <div class="grid-item"><i class="fa-solid fa-bars-staggered"></i><span>Lead</span></div>
  <div class="grid-item"><i class="fa-solid fa-truck-ramp-box"></i><span>Pick Order</span></div>
</div>

<h3 class="section-title">Others</h3>
<div class="grid-container">
  <div class="grid-item"><i class="fa-solid fa-envelope"></i><span>HCW Letter</span></div>
  <div class="grid-item"><i class="fa-solid fa-asterisk"></i><span>Password</span></div>
  <div class="grid-item"><i class="fa-solid fa-comment-dots"></i><span>Feedback</span></div>
  <div class="grid-item"><i class="fa-solid fa-circle-play"></i><span>Video</span></div>
  <div class="grid-item"><i class="fa-solid fa-certificate"></i><span>Certificate</span></div>
  <div class="grid-item" onclick="location.reload()"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span></div>
</div>

</body>
</html>
