<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Health Space - Phlebo App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background: #f4f6f9; color: #2c3e50; padding-bottom: 30px; }

  /* COMMON BUTTONS & INPUTS */
  input {
    width: 100%;
    max-width: 340px;
    padding: 12px 15px;
    margin-top: 12px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
    outline: none;
    background: #fff;
  }
  input:focus { border-color: #1976d2; }

  button {
    width: 100%;
    max-width: 340px;
    padding: 12px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    background: #1976d2;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.2);
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button:active { background: #115293; transform: scale(0.98); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

  /* LOGIN */
  .login {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
    background: #ffffff;
  }
  .login img { margin-bottom: 20px; max-width: 160px; height: auto; }
  .login h2 { color: #1976d2; font-weight: 700; margin-top: 5px; font-size: 24px; }
  .login p { color: #64748b; font-size: 13px; margin-bottom: 10px; }

  /* HEADER & DASHBOARD */
  .header {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
  }
  .header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    margin-right: 15px;
    object-fit: cover;
    border: 2px solid #1976d2;
  }

  .menu-btn {
    margin: 15px;
    padding: 16px 20px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    text-align: left;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #334155;
  }
  .total-box {
    background: linear-gradient(135deg, #1976d2, #0d47a1);
    color: #fff;
    border: none;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
  }

  /* CARDS */
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    margin: 12px 15px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    position: relative;
    border-left: 5px solid #1976d2;
  }
  .card b { font-size: 16px; color: #0f172a; }
  .card-info { margin-top: 6px; font-size: 13.5px; color: #475569; display: flex; align-items: center; gap: 8px; }
  .card-info i { color: #1976d2; width: 16px; }

  .time-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #e3f2fd;
    color: #0d47a1;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .card-actions {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    display: flex;
    gap: 12px;
  }
  .card-actions a {
    flex: 1;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #1e293b;
    border-radius: 8px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  video { width: 100%; max-width: 360px; height: 260px; border-radius: 12px; background: #000; margin: 15px 0; object-fit: cover; }
  
  .back-btn {
    margin: 15px 15px 5px 15px;
    width: auto;
    padding: 8px 16px;
    background: #64748b;
    font-size: 13px;
    box-shadow: none;
  }

  .loader { display: none; text-align: center; padding: 20px; font-weight: 600; color: #1976d2; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <img src="logo.png" alt="Health Space Logo" onerror="this.onerror=null; this.src='1000531193.png';">
  <h2>Health Space</h2>
  <p>Phlebotomist Portal</p>
  <input id="mobile" type="tel" placeholder="Mobile Number">
  <input id="password" type="password" placeholder="Password (12345)">
  <button onclick="startCamera()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
</div>

<!-- CAMERA -->
<div id="cameraBox" style="display:none; text-align:center; padding: 30px 20px;">
  <h3 style="color:#0f172a;">Selfie Attendance</h3>
  <p style="color:#64748b; font-size:13px;">Please take a clear selfie photo</p>
  <video id="video" autoplay playsinline></video><br>
  <button style="background:#2e7d32;" onclick="capturePhoto()"><i class="fa-solid fa-camera"></i> Capture & Continue</button>
</div>

<canvas id="canvas" style="display:none"></canvas>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="header">
    <img id="userPhoto" alt="User">
    <div>
      <b id="userName" style="font-size: 16px;">Phlebotomist</b><br>
      <small style="color: #64748b;">Health Space Field Executive</small>
    </div>
  </div>

  <div class="menu-btn total-box">
    <div>
      <span style="font-size: 12px; opacity: 0.9;">TOTAL COLLECTED</span>
      <div style="font-size: 22px; font-weight:700;">₹<span id="total">0</span></div>
    </div>
    <i class="fa-solid fa-wallet" style="font-size: 26px;"></i>
  </div>

  <div class="menu-btn" onclick="openPatients()">
    <span><i class="fa-solid fa-clipboard-list" style="color: #1976d2; margin-right: 10px;"></i> Pending Patients</span>
    <i class="fa-solid fa-chevron-right" style="color: #cbd5e1;"></i>
  </div>

  <div class="menu-btn" onclick="openCollected()">
    <span><i class="fa-solid fa-circle-check" style="color: #2e7d32; margin-right: 10px;"></i> Collected Patients</span>
    <i class="fa-solid fa-chevron-right" style="color: #cbd5e1;"></i>
  </div>

  <div class="menu-btn" style="color: #d32f2f;" onclick="logout()">
    <span><i class="fa-solid fa-right-from-bracket" style="margin-right: 10px;"></i> Logout</span>
  </div>
</div>

<!-- PATIENTS LIST -->
<div id="patients" style="display:none">
  <button class="back-btn" onclick="goDash()"><i class="fa-solid fa-arrow-left"></i> Dashboard</button>
  <h3 style="padding: 10px 15px 5px 15px; font-size: 18px;">Pending Patients</h3>
  <div id="loader" class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Loading data...</div>
  <div id="list"></div>
</div>

<!-- COLLECTED LIST -->
<div id="collected" style="display:none">
  <button class="back-btn" onclick="goDash()"><i class="fa-solid fa-arrow-left"></i> Dashboard</button>
  <h3 style="padding: 10px 15px 5px 15px; font-size: 18px;">Collected Patients</h3>
  <div id="collectedList"></div>
</div>

<!-- DETAIL VIEW -->
<div id="detail" style="display:none; padding: 15px;">
  <button class="back-btn" style="margin:0 0 15px 0;" onclick="backPatients()"><i class="fa-solid fa-arrow-left"></i> Back to List</button>

  <div id="detailBox" class="card" style="margin: 0 0 15px 0;"></div>

  <div style="background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">
    <h4 style="color:#0f172a; margin-bottom:8px;"><i class="fa-solid fa-indian-rupee-sign" style="color:#1976d2;"></i> 1. Payment Status</h4>
    <input id="pay" type="number" placeholder="Enter Collected Amount">
    <button id="payBtn" onclick="payNow()">Submit Payment</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #f1f5f9;">

    <h4 style="color:#0f172a; margin-bottom:8px;"><i class="fa-solid fa-vial" style="color:#1976d2;"></i> 2. Upload Tubes Photo</h4>
    <input type="file" id="photo" accept="image/*" capture="environment" style="padding: 8px;">
    <button id="uploadBtn" style="background:#2e7d32;" onclick="uploadPhoto()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Photo & Complete</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzDHuowRFqr63Pxnm4Lk_DWjT3oUZIDBqAAYnyGf1qu_UqF8RILKn1qYmXAWIVm7jvH/exec";

let patients = [];
let collected = [];
let currentRowIndex = null;
let activePatient = null; // 🔒 lock system

// AUTO LOGIN
window.onload = function () {
  let t = localStorage.getItem("loginTime");
  let m = localStorage.getItem("mobile");

  if (t && m && (Date.now() - t) < 12 * 60 * 60 * 1000) {
    showDashboard();
    fetchData();
  }
};

// CAMERA
function startCamera() {
  let m = document.getElementById("mobile").value;
  let p = document.getElementById("password").value;

  if (!m) return alert("Enter mobile");
  if (p !== "12345") return alert("Wrong password");

  localStorage.setItem("mobile", m);

  navigator.mediaDevices.getUserMedia({ video: true })
    .then(stream => {
      hideAll();
      document.getElementById("cameraBox").style.display = "block";
      document.getElementById("video").srcObject = stream;
    })
    .catch(() => loginSuccess());
}

// CAPTURE
function capturePhoto() {
  let v = document.getElementById("video");
  let c = document.getElementById("canvas");

  c.width = v.videoWidth || 300;
  c.height = v.videoHeight || 300;
  c.getContext("2d").drawImage(v, 0, 0);

  localStorage.setItem("photo", c.toDataURL("image/jpeg", 0.6));

  if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());

  loginSuccess();
}

function loginSuccess() {
  localStorage.setItem("loginTime", Date.now());
  showDashboard();
  fetchData();
}

// DASHBOARD
function showDashboard() {
  hideAll();
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("userPhoto").src = localStorage.getItem("photo") || "";
}

// FETCH
function fetchData() {
  let m = localStorage.getItem("mobile");

  fetch(API + "?mobile=" + encodeURIComponent(m))
    .then(r => r.json())
    .then(data => {
      patients = [];
      collected = [];

      data.forEach(p => {
        let r = p.data;
        if ((r[10] || "").toLowerCase() === "collected") collected.push(p);
        else patients.push(p);
      });

      render();
      renderCollected();
    });
}

// RENDER
function render() {
  let html = "";

  patients.forEach((p, i) => {
    let r = p.data;

    let locked = activePatient !== null && activePatient !== i;

    html += `
    <div class="card" onclick="${locked ? '' : `openDetail(${i})`}" style="${locked ? 'opacity:0.5' : ''}">
      <b>${r[3]}</b><br>
      🧪 ${r[7]}<br>
      ₹${r[8]}<br>
      📍 ${r[5]}

      <div style="margin-top:10px;">
        ${activePatient === i 
          ? `<button onclick="completePatient(event)">Complete</button>` 
          : `<button onclick="startPatient(event, ${i})" ${locked ? 'disabled' : ''}>Start</button>`
        }
      </div>
    </div>`;
  });

  document.getElementById("list").innerHTML = html;
}

// START
function startPatient(e, i) {
  e.stopPropagation();
  if (activePatient !== null) return alert("Finish current patient first");

  activePatient = i;
  render();
}

// COMPLETE
function completePatient(e) {
  e.stopPropagation();

  let p = patients[activePatient];

  fetch(API, {
    method: "POST",
    body: new URLSearchParams({
      action: "payment",
      row: p.row
    })
  }).then(() => {

    collected.push(p);
    patients.splice(activePatient, 1);

    activePatient = null;

    render();
    renderCollected();
  });
}

// DETAIL
function openDetail(i) {
  if (activePatient !== i) return alert("Start patient first");

  currentRowIndex = i;

  hideAll();
  document.getElementById("detail").style.display = "block";
}

// PHOTO UPLOAD
function uploadPhoto() {
  let file = document.getElementById("photo").files[0];
  if (!file) return alert("Select photo");

  let reader = new FileReader();

  reader.onload = function () {
    let base64 = reader.result.split(",")[1];

    let p = patients[currentRowIndex];

    fetch(API, {
      method: "POST",
      body: new URLSearchParams({
        action: "upload",
        row: p.row,
        file: base64
      })
    }).then(() => {
      alert("Uploaded");
      fetchData();
      openCollected();
    });
  };

  reader.readAsDataURL(file);
}

// COLLECTED
function renderCollected() {
  let html = "";

  collected.forEach(p => {
    let r = p.data;
    html += `<div class="card"><b>${r[3]}</b><br>₹${r[8]}</div>`;
  });

  document.getElementById("collectedList").innerHTML = html;
}

// NAV
function openPatients() { hideAll(); document.getElementById("patients").style.display = "block"; }
function openCollected() { hideAll(); document.getElementById("collected").style.display = "block"; }
function goDash() { hideAll(); document.getElementById("dashboard").style.display = "block"; }

function hideAll() {
  ["login", "dashboard", "patients", "collected", "detail", "cameraBox"].forEach(id => {
    let el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

function logout() {
  localStorage.clear();
  location.reload();
}
