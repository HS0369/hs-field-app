<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Health Space - Phlebo App</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background: #f4f6f9; color: #2c3e50; padding-bottom: 30px; }

  /* COMMON BUTTONS & INPUTS */
  input {
    width: 100%;
    max-width: 340px;
    padding: 12px 15px;
    margin-top: 12px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    font-size: 15px;
    outline: none;
    background: #fff;
  }
  input:focus { border-color: #1976d2; }

  button {
    width: 100%;
    max-width: 340px;
    padding: 12px;
    margin-top: 15px;
    border-radius: 10px;
    border: none;
    background: #1976d2;
    color: #fff;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.2);
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button:active { background: #115293; transform: scale(0.98); }
  button:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

  /* LOGIN */
  .login {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
    text-align: center;
    background: #ffffff;
  }
  .login img { margin-bottom: 20px; max-width: 160px; height: auto; }
  .login h2 { color: #1976d2; font-weight: 700; margin-top: 5px; font-size: 24px; }
  .login p { color: #64748b; font-size: 13px; margin-bottom: 10px; }

  /* HEADER & DASHBOARD */
  .header {
    display: flex;
    align-items: center;
    padding: 15px 20px;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
  }
  .header img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    margin-right: 15px;
    object-fit: cover;
    border: 2px solid #1976d2;
  }

  .menu-btn {
    margin: 15px;
    padding: 16px 20px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    text-align: left;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #334155;
  }
  .total-box {
    background: linear-gradient(135deg, #1976d2, #0d47a1);
    color: #fff;
    border: none;
    box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
  }

  /* CARDS */
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    margin: 12px 15px;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    position: relative;
    border-left: 5px solid #1976d2;
  }
  .card b { font-size: 16px; color: #0f172a; }
  .card-info { margin-top: 6px; font-size: 13.5px; color: #475569; display: flex; align-items: center; gap: 8px; }
  .card-info i { color: #1976d2; width: 16px; }

  .time-badge {
    position: absolute;
    top: 15px;
    right: 15px;
    background: #e3f2fd;
    color: #0d47a1;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .card-actions {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    display: flex;
    gap: 12px;
  }
  .card-actions a {
    flex: 1;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 9px;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #1e293b;
    border-radius: 8px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  video { width: 100%; max-width: 360px; height: 260px; border-radius: 12px; background: #000; margin: 15px 0; object-fit: cover; }
  
  .back-btn {
    margin: 15px 15px 5px 15px;
    width: auto;
    padding: 8px 16px;
    background: #64748b;
    font-size: 13px;
    box-shadow: none;
  }

  .loader { display: none; text-align: center; padding: 20px; font-weight: 600; color: #1976d2; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <img src="logo.png" alt="Health Space Logo" onerror="this.onerror=null; this.src='1000531193.png';">
  <h2>Health Space</h2>
  <p>Phlebotomist Portal</p>
  <input id="mobile" type="tel" placeholder="Mobile Number">
  <input id="password" type="password" placeholder="Password (12345)">
  <button onclick="startCamera()"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
</div>

<!-- CAMERA -->
<div id="cameraBox" style="display:none; text-align:center; padding: 30px 20px;">
  <h3 style="color:#0f172a;">Selfie Attendance</h3>
  <p style="color:#64748b; font-size:13px;">Please take a clear selfie photo</p>
  <video id="video" autoplay playsinline></video><br>
  <button style="background:#2e7d32;" onclick="capturePhoto()"><i class="fa-solid fa-camera"></i> Capture & Continue</button>
</div>

<canvas id="canvas" style="display:none"></canvas>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">
  <div class="header">
    <img id="userPhoto" alt="User">
    <div>
      <b id="userName" style="font-size: 16px;">Phlebotomist</b><br>
      <small style="color: #64748b;">Health Space Field Executive</small>
    </div>
  </div>

  <div class="menu-btn total-box">
    <div>
      <span style="font-size: 12px; opacity: 0.9;">TOTAL COLLECTED</span>
      <div style="font-size: 22px; font-weight:700;">₹<span id="total">0</span></div>
    </div>
    <i class="fa-solid fa-wallet" style="font-size: 26px;"></i>
  </div>

  <div class="menu-btn" onclick="openPatients()">
    <span><i class="fa-solid fa-clipboard-list" style="color: #1976d2; margin-right: 10px;"></i> Pending Patients</span>
    <i class="fa-solid fa-chevron-right" style="color: #cbd5e1;"></i>
  </div>

  <div class="menu-btn" onclick="openCollected()">
    <span><i class="fa-solid fa-circle-check" style="color: #2e7d32; margin-right: 10px;"></i> Collected Patients</span>
    <i class="fa-solid fa-chevron-right" style="color: #cbd5e1;"></i>
  </div>

  <div class="menu-btn" style="color: #d32f2f;" onclick="logout()">
    <span><i class="fa-solid fa-right-from-bracket" style="margin-right: 10px;"></i> Logout</span>
  </div>
</div>

<!-- PATIENTS LIST -->
<div id="patients" style="display:none">
  <button class="back-btn" onclick="goDash()"><i class="fa-solid fa-arrow-left"></i> Dashboard</button>
  <h3 style="padding: 10px 15px 5px 15px; font-size: 18px;">Pending Patients</h3>
  <div id="loader" class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Loading data...</div>
  <div id="list"></div>
</div>

<!-- COLLECTED LIST -->
<div id="collected" style="display:none">
  <button class="back-btn" onclick="goDash()"><i class="fa-solid fa-arrow-left"></i> Dashboard</button>
  <h3 style="padding: 10px 15px 5px 15px; font-size: 18px;">Collected Patients</h3>
  <div id="collectedList"></div>
</div>

<!-- DETAIL VIEW -->
<div id="detail" style="display:none; padding: 15px;">
  <button class="back-btn" style="margin:0 0 15px 0;" onclick="backPatients()"><i class="fa-solid fa-arrow-left"></i> Back to List</button>

  <div id="detailBox" class="card" style="margin: 0 0 15px 0;"></div>

  <div style="background: #fff; padding: 18px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">
    <h4 style="color:#0f172a; margin-bottom:8px;"><i class="fa-solid fa-indian-rupee-sign" style="color:#1976d2;"></i> 1. Payment Status</h4>
    <input id="pay" type="number" placeholder="Enter Collected Amount">
    <button id="payBtn" onclick="payNow()">Submit Payment</button>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #f1f5f9;">

    <h4 style="color:#0f172a; margin-bottom:8px;"><i class="fa-solid fa-vial" style="color:#1976d2;"></i> 2. Upload Tubes Photo</h4>
    <input type="file" id="photo" accept="image/*" capture="environment" style="padding: 8px;">
    <button id="uploadBtn" style="background:#2e7d32;" onclick="uploadPhoto()"><i class="fa-solid fa-cloud-arrow-up"></i> Upload Photo & Complete</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzDHuowRFqr63Pxnm4Lk_DWjT3oUZIDBqAAYnyGf1qu_UqF8RILKn1qYmXAWIVm7jvH/exec";

let patients = [];
let collected = [];
let currentRowIndex = null;
let paymentDone = false;

// AUTO LOGIN
window.onload = function() {
  let t = localStorage.getItem("loginTime");
  let m = localStorage.getItem("mobile");

  if (t && m && (Date.now() - t) < 12 * 60 * 60 * 1000) {
    showDashboard();
    fetchData();
  }
};

function startCamera() {
  let m = document.getElementById("mobile").value;
  let p = document.getElementById("password").value;

  if (!m) { alert("Please enter mobile number"); return; }
  if (p !== "12345") { alert("Wrong password"); return; }

  localStorage.setItem("mobile", m);

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(stream => {
      hideAll();
      document.getElementById("cameraBox").style.display = "block";
      document.getElementById("video").srcObject = stream;
    })
    .catch(err => {
      alert("Camera access denied or not available. Continuing login...");
      loginSuccess();
    });
}

function capturePhoto() {
  let v = document.getElementById("video");
  let c = document.getElementById("canvas");

  c.width = v.videoWidth || 300;
  c.height = v.videoHeight || 300;
  c.getContext("2d").drawImage(v, 0, 0);

  localStorage.setItem("photo", c.toDataURL("image/jpeg", 0.6));

  if (v.srcObject) {
    v.srcObject.getTracks().forEach(track => track.stop());
  }

  loginSuccess();
}

function loginSuccess() {
  localStorage.setItem("loginTime", Date.now());
  showDashboard();
  fetchData();
}

function showDashboard() {
  hideAll();
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("userName").innerText = localStorage.getItem("name") || "Phlebotomist";
  document.getElementById("userPhoto").src = localStorage.getItem("photo") || "https://via.placeholder.com/50";
}

// FETCH DATA
function fetchData() {
  let m = localStorage.getItem("mobile");
  document.getElementById("loader").style.display = "block";

  fetch(API + "?mobile=" + encodeURIComponent(m))
    .then(r => r.json())
    .then(data => {
      document.getElementById("loader").style.display = "none";
      patients = [];
      collected = [];

      data.forEach(obj => {
        let status = String(obj.data[10]).trim(); // Col K (Index 10)
        if (status.toLowerCase() === "collected") {
          collected.push(obj);
        } else {
          patients.push(obj);
        }
      });

      if (patients.length && patients[0].data[6]) {
        localStorage.setItem("name", patients[0].data[6]);
        document.getElementById("userName").innerText = patients[0].data[6];
      }

      render();
      renderCollected();
      updateTotal();
    })
    .catch(err => {
      document.getElementById("loader").style.display = "none";
      console.error("Error fetching data:", err);
    });
}

// RENDER PENDING PATIENTS
function render() {
  let html = "";
  if (patients.length === 0) {
    html = "<p style='text-align:center; padding:30px; color:#64748b;'>No pending patients assigned.</p>";
  } else {
    patients.forEach((p, i) => {
      let r = p.data;
      html += `
      <div class="card" onclick="openDetail(${i})">
        <span class="time-badge"><i class="fa-regular fa-clock"></i> ${formatTime(r[2])}</span>
        <b>👤 ${r[3] || 'N/A'}</b>
        <div class="card-info"><i class="fa-solid fa-vial"></i> <span>Test: ${r[7] || 'N/A'}</span></div>
        <div class="card-info"><i class="fa-solid fa-indian-rupee-sign"></i> <span>Amount: ₹${r[8] || 0}</span></div>
        <div class="card-info"><i class="fa-solid fa-location-dot"></i> <span>${r[5] || 'N/A'}</span></div>
        
        <div class="card-actions">
          <a href="tel:${r[4]}" onclick="event.stopPropagation()">
            <i class="fa-solid fa-phone" style="color:#2e7d32;"></i> Call
          </a>
          <a href="https://maps.google.com/?q=${encodeURIComponent(r[5])}" target="_blank" onclick="event.stopPropagation()">
            <i class="fa-solid fa-map-location-dot" style="color:#1976d2;"></i> Map
          </a>
        </div>
      </div>`;
    });
  }
  document.getElementById("list").innerHTML = html;
}

// DETAIL VIEW
function openDetail(i) {
  currentRowIndex = i;
  paymentDone = (patients[i].data[12] === "Yes"); // Col M check
  let r = patients[i].data;

  hideAll();
  document.getElementById("detail").style.display = "block";
  document.getElementById("pay").value = r[8] || "";

  document.getElementById("detailBox").innerHTML = `
    <div style="font-size:17px; font-weight:700; margin-bottom:8px;">👤 ${r[3]}</div>
    <div class="card-info"><i class="fa-solid fa-vial"></i> <b>Test:</b> ${r[7]}</div>
    <div class="card-info"><i class="fa-solid fa-location-dot"></i> <b>Address:</b> ${r[5]}</div>
    <div class="card-info"><i class="fa-solid fa-phone"></i> <b>Phone:</b> ${r[4]}</div>
    <div class="card-info"><i class="fa-solid fa-receipt"></i> <b>Bill Amount:</b> ₹${r[8]}</div>
    
    <div class="card-actions" style="margin-top:12px;">
      <a href="tel:${r[4]}"><i class="fa-solid fa-phone" style="color:#2e7d32;"></i> Call Patient</a>
      <a href="https://maps.google.com/?q=${encodeURIComponent(r[5])}" target="_blank"><i class="fa-solid fa-map-location-dot" style="color:#1976d2;"></i> Open Map</a>
    </div>
  `;
}

// SUBMIT PAYMENT
function payNow() {
  let amt = Number(document.getElementById("pay").value);

  if (!amt || amt <= 0) { alert("Please enter a valid amount"); return; }
  
  let btn = document.getElementById("payBtn");
  btn.disabled = true;
  btn.innerText = "Submitting...";

  fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({
      action: "payment",
      row: patients[currentRowIndex].row
    })
  })
  .then(r => r.json())
  .then(res => {
    btn.disabled = false;
    btn.innerText = "Submit Payment";
    if (res.result === "success") {
      paymentDone = true;
      alert("✅ Payment recorded successfully! Now upload tube photo.");
    } else {
      alert("Error: " + res.message);
    }
  })
  .catch(err => {
    btn.disabled = false;
    btn.innerText = "Submit Payment";
    alert("Network Error!");
  });
}

// UPLOAD PHOTO
function uploadPhoto() {
  let fileInput = document.getElementById("photo");
  let file = fileInput.files[0];

  if (!file) { alert("Please select or capture a photo first!"); return; }

  let btn = document.getElementById("uploadBtn");
  btn.disabled = true;
  btn.innerText = "Uploading Photo...";

  let reader = new FileReader();
  reader.onload = function() {
    let base64 = reader.result.split(",")[1];

    fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "upload",
        row: patients[currentRowIndex].row,
        file: base64
      })
    })
    .then(r => r.json())
    .then(res => {
      btn.disabled = false;
      btn.innerText = "Upload Photo & Complete";

      if (res.result === "success") {
        alert("🎉 Sample collected & photo saved to Drive!");
        fileInput.value = "";
        fetchData();
        openCollected();
      } else {
        alert("Upload failed: " + res.message);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = "Upload Photo & Complete";
      alert("Error uploading file to server.");
    });
  };

  reader.readAsDataURL(file);
}

// COLLECTED TAB
function renderCollected() {
  let html = "";
  if (collected.length === 0) {
    html = "<p style='text-align:center; padding:30px; color:#64748b;'>No collected records yet.</p>";
  } else {
    collected.forEach(p => {
      let r = p.data;
      html += `
      <div class="card" style="border-left-color: #2e7d32;">
        <b>👤 ${r[3]}</b>
        <div class="card-info"><i class="fa-solid fa-vial"></i> ${r[7]}</div>
        <div class="card-info"><i class="fa-solid fa-circle-check" style="color:#2e7d32;"></i> <b>Collected:</b> ₹${r[8]}</div>
        ${r[11] ? `<div class="card-actions"><a href="${r[11]}" target="_blank"><i class="fa-solid fa-image"></i> View Tubes Photo</a></div>` : ''}
      </div>`;
    });
  }
  document.getElementById("collectedList").innerHTML = html;
}

function updateTotal() {
  let total = 0;
  collected.forEach(p => total += Number(p.data[8] || 0));
  document.getElementById("total").innerText = total;
}

// TIME FORMATTER (12-Hour format)
function formatTime(val) {
  if (!val) return "N/A";
  let d = new Date(val);
  if (!isNaN(d.getTime())) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
  }
  return val;
}

// NAVIGATION
function openPatients() { hideAll(); document.getElementById("patients").style.display = "block"; }
function openCollected() { hideAll(); document.getElementById("collected").style.display = "block"; }
function goDash() { hideAll(); document.getElementById("dashboard").style.display = "block"; }
function backPatients() { openPatients(); }

function hideAll() {
  ["login", "dashboard", "patients", "collected", "detail", "cameraBox"].forEach(id => {
    let el = document.getElementById(id);
    if (el) el.style.display = "none";
  });
}

function logout() {
  if (confirm("Logout from Health Space?")) {
    localStorage.clear();
    location.reload();
  }
}
</script>

</body>
</html>
