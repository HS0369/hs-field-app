<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health Space - Phlebo Field App</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
    .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid #2196F3; }
    .locked { opacity: 0.5; pointer-events: none; border-left-color: #9e9e9e; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
    .paid { background: #e8f5e9; color: #2e7d32; }
    .due { background: #ffebee; color: #c62828; }
    .btn { background: #2196F3; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-size: 14px; }
    .btn-danger { background: #f44336; }
    .btn-success { background: #4CAF50; }
    .qr-box { text-align: center; margin: 10px 0; display: none; }
    .qr-box img { width: 180px; height: 180px; }
    input, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .lock-msg { color: #d32f2f; font-weight: bold; font-size: 13px; margin-top: 5px; }
  </style>
</head>
<body>

  <h2>📋 Health Space Field Visits</h2>
  <div id="patient-list">लोड होत आहे...</div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzDHuowRFqr63Pxnm4Lk_DWjT3oUZIDBqAAYnyGf1qu_UqF8RILKn1qYmXAWIVm7jvH/exec"; // तुमची Apps Script URL टाकणे
    const UPI_ID = "healthspace@ybl";

    async function fetchPatients() {
      const res = await fetch(SCRIPT_URL + "?mobile=all");
      const data = await res.json();
      
      // वेळेनुसार शॉटिंग करणे (Time Slot Sequence)
      data.sort((a, b) => a.timeSlot.localeCompare(b.timeSlot));

      const container = document.getElementById('patient-list');
      container.innerHTML = '';

      let previousDone = true; // पहिला पेशंट अनलॉक असेल

      data.forEach((p, index) => {
        const isPaid = p.paymentStatus === "Yes";
        const isDone = p.status === "Collected" || p.status === "Rescheduled";
        const isLocked = !previousDone;

        let html = `
          <div class="card ${isLocked ? 'locked' : ''}">
            <h3>${p.patientName} (${p.timeSlot})</h3>
            <p><strong>पत्ता:</strong> ${p.address}</p>
            <p><strong>चाचण्या:</strong> ${p.tests}</p>
            <p><strong>रक्कम:</strong> ₹${p.amount} 
              <span class="status-badge ${isPaid ? 'paid' : 'due'}">${isPaid ? 'PAID' : 'DUE'}</span>
            </p>
            
            ${isLocked ? '<div class="lock-msg">🔒 आधीचा पेशंट पूर्ण झाल्याशिवाय हे अनलॉक होणार नाही.</div>' : ''}

            <!-- 1. पेमेंट सेक्‍शन -->
            ${!isPaid && !isLocked ? `
              <hr>
              <button class="btn" onclick="showQR('${p.amount}', 'qr-${index}')">📲 Online UPI QR दाखवा</button>
              <div id="qr-${index}" class="qr-box">
                <p>स्कॅन करून ₹${p.amount} भरा:</p>
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${UPI_ID}%26pn=HealthSpace%26am=${p.amount}%26cu=INR" alt="QR">
                <button class="btn btn-success" onclick="markPaid(${p.row})">कन्फर्म पेमेंट (Payment Done)</button>
              </div>
              <button class="btn btn-success" style="margin-top:5px;" onclick="markPaid(${p.row})">💵 Cash Received</button>
            ` : ''}

            <!-- 2. सॅम्पल फोटो अपलोड (फक्त Paid असल्‍यावरच) -->
            ${isPaid && !isDone && !isLocked ? `
              <hr>
              <label><strong>Tube Photo अपलोड करा:</strong></label>
              <input type="file" id="file-${p.row}" accept="image/*">
              <button class="btn btn-success" onclick="uploadPhoto(${p.row})">Upload Photo & Complete</button>
            ` : ''}

            <!-- 3. सॅम्पल Not Collected / Reschedule -->
            ${!isDone && !isLocked ? `
              <hr>
              <button class="btn btn-danger" onclick="toggleReschedule('res-${index}')">❌ Sample Not Collected</button>
              <div id="res-${index}" style="display:none; margin-top:10px;">
                <input type="text" id="reason-${p.row}" placeholder="न घेण्याचे कारण (उदा. Patient Unavailable)">
                <label>नवी तारीख:</label>
                <input type="date" id="date-${p.row}">
                <label>नवी वेळ:</label>
                <input type="time" id="time-${p.row}">
                <button class="btn btn-danger" onclick="submitReschedule(${p.row})">Submit & Reschedule</button>
              </div>
            ` : ''}

            ${isDone ? `<div style="color:green; font-weight:bold; margin-top:10px;">✅ Status: ${p.status}</div>` : ''}
          </div>
        `;

        container.innerHTML += html;

        // जर हा पेशंट कम्प्लीट झाला नसेल, तर पुढचे सर्व पेशंट्स ब्लॉक होतील
        if (!isDone) {
          previousDone = false;
        }
      });
    }

    function showQR(amount, elementId) {
      document.getElementById(elementId).style.display = 'block';
    }

    function toggleReschedule(id) {
      const el = document.getElementById(id);
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function markPaid(row) {
      if(!confirm("पेमेंट जमा झाले आहे याची खात्री आहे का?")) return;
      await fetch(`${SCRIPT_URL}?action=payment&row=${row}`, { method: 'POST' });
      alert("पेमेंट अपडेट झाले!");
      fetchPatients();
    }

    async function uploadPhoto(row) {
      const fileInput = document.getElementById(`file-${row}`);
      if (!fileInput.files[0]) return alert("कृपया फोटो निवडा!");

      const reader = new FileReader();
      reader.onload = async function () {
        const base64 = reader.result.split(',')[1];
        const formData = new URLSearchParams();
        formData.append("file", base64);

        await fetch(`${SCRIPT_URL}?action=upload&row=${row}`, {
          method: 'POST',
          body: formData
        });
        alert("सॅम्पल यशस्वीरीत्या सबमिट झाले!");
        fetchPatients();
      };
      reader.readAsDataURL(fileInput.files[0]);
    }

    async function submitReschedule(row) {
      const reason = document.getElementById(`reason-${row}`).value;
      const newDate = document.getElementById(`date-${row}`).value;
      const newTime = document.getElementById(`time-${row}`).value;

      if (!reason || !newDate || !newTime) return alert("कृपया संपूर्ण माहिती भरा!");

      await fetch(`${SCRIPT_URL}?action=reschedule&row=${row}&reason=${encodeURIComponent(reason)}&newDate=${newDate}&newTime=${newTime}`, {
        method: 'POST'
      });
      alert("पेशंट री-शेड्युल करण्यात आला आहे!");
      fetchPatients();
    }

    fetchPatients();
  </script>
</body>
</html>
